name: dbt Docs

on:
  push:
    branches: [main]
    paths:
      - "src/silver/**"
  workflow_dispatch:

jobs:
  docs:
    name: Generate & Deploy dbt Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install dbt-duckdb
      - name: Generate dbt docs
        run: |
          cd src/silver
          dbt docs generate --profiles-dir . --project-dir .
        env:
          DUCKDB_PATH: ":memory:"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/silver/target/

  deploy-pages:
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

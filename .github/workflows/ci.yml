name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DUCKDB_PATH: "data/test.duckdb"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run ruff linter
        run: uv run ruff check --output-format=github .
      - name: Run ruff formatter check
        run: uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy src/ --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      redpanda:
        image: redpandadata/redpanda:v24.1.2
        ports:
          - 9092:9092
          - 9644:9644
        options: >
          --health-cmd "curl -sf http://localhost:9644/v1/status/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO ready"
              break
            fi
            sleep 1
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: src
      - name: Create test data directory
        run: mkdir -p data
      - name: Test dbt compilation
        run: |
          cd src/silver
          uv run dbt compile --profiles-dir . --project-dir .
        env:
          DUCKDB_PATH: ${{ env.DUCKDB_PATH }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: medallion-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Docker test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: false
          tags: medallion-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

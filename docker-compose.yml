x-shared: &shared
  networks:
    - medallion

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ''
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.2
    <<: [*shared, *logging]
    container_name: medallion-redpanda
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8081:8081"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - http://redpanda:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    <<: [*shared, *logging]
    container_name: medallion-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    <<: *shared
    container_name: medallion-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: |
      -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/medallion &&
      echo 'Buckets created successfully'
      "
    restart: on-failure:3

  airflow-postgres:
    image: postgres:15
    <<: [*shared, *logging]
    container_name: medallion-airflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.1-python3.12
    <<: [*shared, *logging]
    container_name: medallion-airflow-init
    environment:
      <<: *airflow-env
    depends_on:
      - airflow-postgres
    entrypoint: >
      /bin/bash -c
      "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.1-python3.12
    <<: [*shared, *logging]
    container_name: medallion-airflow-webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    command: airflow webserver
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.12
    <<: [*shared, *logging]
    container_name: medallion-airflow-scheduler
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    command: airflow scheduler
    depends_on:
      - airflow-init

  app:
    build:
      context: .
      dockerfile: Dockerfile
    <<: [*shared, *logging]
    container_name: medallion-app
    environment:
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: medallion
      MINIO_SECURE: "false"
      DUCKDB_PATH: /app/data/medallion.duckdb
      ICEBERG_WAREHOUSE: s3://medallion/iceberg/
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/app/data
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully

networks:
  medallion:
    name: medallion-network
    driver: bridge

volumes:
  redpanda_data:
    driver: local
  minio_data:
    driver: local
  airflow_db:
    driver: local
